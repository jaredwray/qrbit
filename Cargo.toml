[package]
name = "qrbit"
version = "0.1.0"
edition = "2021"
authors = ["Jared Wray <me@jaredwray.com>"]
description = "A fast QR code generator with logo embedding support"
license = "MIT"
repository = "https://github.com/jaredwray/qrbit"

[lib]
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", features = ["png", "jpeg", "webp"] }
svg = "0.18"
base64 = "0.23.0"
resvg = "0.47"
tiny-skia = "0.12"
napi = "3.12.0"
napi-derive = "3.6.1"
quircs = "0.10"

[build-dependencies]
napi-build = "2.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
