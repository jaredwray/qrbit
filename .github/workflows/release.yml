name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  aikido-gate:
    name: Aikido release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.6"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Aikido CI client
        # zizmor: ignore[adhoc-packages] pinned Aikido CI client for the release gate
        run: sfw npm install --global @aikidosec/ci-api-client@1.0.17

      # Fails on new SAST/IaC/secrets findings. The API key comes from Aikido's
      # Continuous Integration settings — it grants no publish authority.
      - name: Run Aikido release scan
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
        run: >
          aikido-api-client scan-release
          "$REPO_NAME" "$GITHUB_SHA"
          --apikey "$AIKIDO_CLIENT_API_KEY"
          --fail-on-sast-scan --fail-on-iac-scan --fail-on-secrets-scan

  build-artifacts:
    name: build-artifacts
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
            test: true
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-musl
            triple: linux-x64-musl
            container: node:22.23.2-alpine3.24@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
            build_env: alpine
            test: true
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
            test: true
          - os: macos-latest
            arch: x64
            target: x86_64-apple-darwin
            triple: darwin-x64
            test: false
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            triple: darwin-arm64
            test: true

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Alpine Dependencies
        if: matrix.build_env == 'alpine'
        run: |
          apk add --no-cache \
            python3 \
            make \
            g++ \
            musl-dev \
            clang \
            llvm \
            build-base \
            bash \
            curl \
            libstdc++ \
            libgcc

      # SocketDev/action keys the binary off process.platform/arch only, so in
      # this Alpine container it installs glibc sfw-free-linux-x86_64. Exec then
      # fails as `sfw: not found` because ld-linux is missing. Install the musl
      # build of the same pinned version instead.
      - name: Install Socket Firewall
        if: matrix.build_env != 'alpine'
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.6"

      - name: Install Socket Firewall (musl)
        if: matrix.build_env == 'alpine'
        env:
          SFW_VERSION: "1.15.6"
          SFW_MUSL_SHA256: 53ce0f90be2592239d2e5b135487324364805debee9d6120484756a2fc4d234b
        # zizmor: ignore[unpinned-downloads] pinned sfw-free v1.15.6 musl binary with sha256
        run: |
          url="https://github.com/SocketDev/sfw-free/releases/download/v${SFW_VERSION}/sfw-free-musl-linux-x86_64"
          tmp="$(mktemp)"
          curl -fsSL -o "$tmp" "$url"
          echo "${SFW_MUSL_SHA256}  ${tmp}" | sha256sum -c -
          install -m 0755 "$tmp" /usr/local/bin/sfw
          rm -f "$tmp"
          command -v sfw

      # Setup pnpm (version is read from the packageManager field in package.json)
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Setup Node - Skip for Alpine (already in container)
      - name: Use Node.js
        if: matrix.build_env != 'alpine'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Rust
        run: |
          rustup target add ${{ matrix.target }}
          pnpm napi build --platform --release --output-dir src --no-js --dts generated-napi.d.ts --target ${{ matrix.target }}

      - name: Build
        run: pnpm build:ts && pnpm build:copy

      - name: Run Tests
        if: ${{ matrix.test }}
        run: pnpm test:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.target }}
          path: dist/qrbit.${{ matrix.triple }}.node

  build-release:
    name: build-release
    needs: [build-artifacts, aikido-gate]
    runs-on: ubuntu-latest

    # OIDC Trusted Publishing requires id-token: write so pnpm can mint an
    # OIDC token and generate provenance attestations. No NPM_TOKEN needed.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.6"

      # Setup pnpm (version is read from the packageManager field in package.json)
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Setup Node
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build Typescript Project
        run: pnpm build:ts

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Show Artifacts
        run: ls -alhR ./artifacts

      - name: Remove Artifacts in Dist
        run: rm -f dist/*.node

      - name: Copy all artifacts that end in .node to dist
        run: |
          find ./artifacts -name "*.node" -exec cp {} dist/ \;

      - name: Show Dist
        run: |
            ls -alh ./dist

      # Stages via OIDC Trusted Publishing (no token). The trusted publisher
      # on npmjs.com must be stage-only so this job cannot publish live.
      # --no-git-checks: git-checks run even for a tarball and fail on a
      # detached release-tag checkout and on the untracked pack output.
      - name: Pack
        run: |
          mkdir -p packed
          pnpm pack --pack-destination packed
          ls -la packed

      - name: Stage publish
        run: pnpm stage publish ./packed/*.tgz --access public --provenance --no-git-checks
