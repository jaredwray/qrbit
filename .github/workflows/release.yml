name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-artifacts:
    name: build-artifacts
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            arch: x64
            target: x86_64-unknown-linux-musl
            container: node:22.23.1-alpine3.24
            build_env: alpine
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            arch: x64
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Alpine Dependencies
        if: matrix.build_env == 'alpine'
        run: |
          apk add --no-cache \
            python3 \
            make \
            g++ \
            musl-dev \
            clang \
            llvm \
            build-base \
            bash \
            curl

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"

      # Setup pnpm (version is read from the packageManager field in package.json)
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Setup Node - Skip for Alpine (already in container)
      - name: Use Node.js
        if: matrix.build_env != 'alpine'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Rust
        run: |
          rustup target add ${{matrix.target}}
          pnpm napi build --platform --release --output-dir src --target ${{ matrix.target }}

      - name: Build
        run: pnpm build:release

      - name: Run Tests
        run: pnpm test:ci

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.target }}
          path: dist/*.node

  build-release:
    name: build-release
    needs: build-artifacts
    runs-on: ubuntu-latest

    # OIDC Trusted Publishing requires id-token: write so pnpm can mint an
    # OIDC token and generate provenance attestations. No NPM_TOKEN needed.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"

      # Setup pnpm (version is read from the packageManager field in package.json)
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Setup Node
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build Typescript Project
        run: pnpm build:release

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Show Artifacts
        run: ls -alhR ./artifacts

      - name: Remove Artifacts in Dist
        run: rm -f dist/*.node

      - name: Copy all artifacts that end in .node to dist
        run: |
          find ./artifacts -name "*.node" -exec cp {} dist/ \;

      - name: Show Dist
        run: |
            ls -alh ./dist

      # Publishes via OIDC Trusted Publishing (no token), using the pnpm
      # installed above by pnpm/action-setup. Provenance is generated
      # automatically; --provenance keeps the intent explicit. --no-git-checks
      # is required because pnpm otherwise refuses to publish in CI.
      # Requires a trusted publisher to be configured for this package on
      # npmjs.com pointing at this repo and workflow.
      - name: Publish
        run: pnpm publish --provenance --no-git-checks --ignore-scripts
